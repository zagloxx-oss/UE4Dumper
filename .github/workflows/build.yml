name: Build UE4Dumper

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: ntltd/setup-ndk@v1
        with:
          ndk-version: r21e  # r21e — последняя версия, которая по умолчанию не ломает совместимость [citation:6]

      - name: Build with ndk-build
        run: |
          # Скачиваем NDK r21e
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q android-ndk-r21e-linux-x86_64.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r21e
          export PATH=$ANDROID_NDK_HOME:$PATH

          # Собираем проект
          cd jni
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ue4dumper64
          path: libs/arm64-v8a/ue4dumper64
